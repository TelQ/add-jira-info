name: Check Dist

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Verify Node is patched for CVE-2026-111497 (Brotli)
        run: |
          node -e "const z=require('zlib');if(z.constants.BROTLI_DECODER_ERROR_FORMAT_BLOCK_SWITCH===undefined){console.error('Node '+process.version+' is vulnerable to CVE-2026-111497');process.exit(1)}try{z.brotliDecompressSync(Buffer.from('200010414141fcffff07002228f00b60f7f41f000000','hex'));console.error('invalid brotli accepted');process.exit(1)}catch(e){if(e.code!=='ERR__ERROR_FORMAT_BLOCK_SWITCH')throw e}console.log('CVE-2026-111497: '+process.version+' patched')"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild the dist/ directory
        run: npm run build

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
        id: diff

      # If index.js was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
